# ─────────────────────────────────────────────────────────────────────────────
# Publications. Edited by hand — Jekyll reads this file directly, so changes
# show up in the live preview immediately. Nothing to regenerate.
#
# Fields:
#   id       required. The reference handle used by _data/selected.yml, and the
#            filename of both thumbnails:
#              assets/img/pub/<id>.jpg     the paper's own figure
#              assets/img/paper/<id>.jpg   generated page-1 preview
#   authors  write initials yourself. A trailing * marks equal contribution and
#            renders as ✳ with a legend on the publications page. Your own name
#            is bolded automatically (see `author_short` in _config.yml).
#   venue    the short label shown in the pill, e.g. ICML, NeurIPS, CVPR.
#   thumb    figure | paper. Omit for automatic: the page-1 preview if one
#            exists, otherwise the figure.
#   links    any of arxiv (bare id), html, pdf, code, project. Rendered in that
#            order with fixed labels. QUOTE the arxiv id — unquoted, YAML reads
#            it as a number and 2410.16290 silently becomes 2410.1629.
#
# Order here does not matter — the publications page groups by year, and the
# homepage order comes from _data/selected.yml.
#
# After adding an entry, run:  python3 bin/prepare.py
# ─────────────────────────────────────────────────────────────────────────────

