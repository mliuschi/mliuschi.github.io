- date: 2025-07-21
  text: >
    I started my PhD at Stanford, where I'm currently rotating under
    Prof. Carlos Guestrin!

- date: 2025-06-13
  text: >
    Graduated from Caltech and am very honored to have received the
    George W. Housner Prize for Academic Excellence and Original Research!

- date: 2025-06-12
  text: >
    Our new paper, ["Principled Approaches for Extending Neural Architectures
    to Function Spaces for Operator Learning"](https://arxiv.org/abs/2506.10973)
    is on arXiv!

- date: 2025-04-08
  text: >
    I'm very honored to have been named an NSF GRFP fellow!

- date: 2024-10-23
  text: >
    Our new paper, ["Unifying Subsampling Pattern Variations for Compressed
    Sensing MRI with Neural Operators"](https://arxiv.org/abs/2410.16290)
    is on arXiv!

- date: 2024-09-20
  text: >
    I gave an invited talk at the [2024 Human-Centered AI
    Conference](https://seaver.pepperdine.edu/events/human-centered-ai-conference/)
    on tipping point forecasting on function spaces. Many thanks to
    [Prof. Fabien Scalzo](https://web.cs.ucla.edu/~fab/) for the invitation!

- date: 2024-07-21
  text: >
    I presented our recent papers ["Neural Operators with Localized Integral
    and Differential Kernels"](https://arxiv.org/abs/2402.16845) and
    ["Towards Enforcing Hard Physics Constraints in Operator Learning
    Frameworks"](https://openreview.net/pdf?id=Zvxm14Rd1F) at ICML 2024
    in Vienna!

- date: 2024-06-17
  text: >
    I am starting my internship in the Learning and Perception research group
    at NVIDIA Research!

- date: 2024-05-15
  text: >
    I have been named a recipient of the 2024 Henry Ford II Scholar Award!
    I am very grateful for the support of all my mentors and from the
    computer science department.
