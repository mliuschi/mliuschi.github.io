<!DOCTYPE html>
<html lang="en">
<head>{% include head.html %}</head>
<body>
<div class="wrap">

  <div class="topbar">
    <nav class="topnav">
      <a href="{{ '/' | relative_url }}"
         {% if page.url == '/' %}aria-current="page"{% endif %}>About</a>
      <a href="{{ '/news/' | relative_url }}"
         {% if page.url == '/news/' %}aria-current="page"{% endif %}>News</a>
      <a href="{{ '/publications/' | relative_url }}"
         {% if page.url == '/publications/' %}aria-current="page"{% endif %}>Publications</a>
    </nav>
    <a class="cv-btn" href="{{ site.cv_path | relative_url }}" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5l-5-5h3.5V3h3v7.5H17l-5 5zM4 19h16v2H4z"/></svg>
      <span>CV</span>
    </a>
  </div>

  <header class="masthead">
    <div class="portrait">
      <img src="{{ site.avatar | relative_url }}" alt="{{ site.author }}"
           width="480" height="480">
    </div>
    <div class="mast-text">
      <h1 class="name">{{ site.title }}</h1>
      <p class="tagline">{{ site.role }}<span class="sep">/</span>{{ site.affiliation_html }}</p>
      <p class="mast-email">{{ site.email_display }}</p>
      {% include socials.html %}
    </div>
  </header>

  {{ content }}

  <footer>
    <p class="foot-note">&copy; {{ 'now' | date: "%Y" }} {{ site.author }}</p>
  </footer>

</div>
</body>
</html>
