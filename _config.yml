# ─────────────────────────────────────────────────────────────────────────────
# Site settings. Built natively by GitHub Pages — no plugins, no Actions.
# ─────────────────────────────────────────────────────────────────────────────

title: Miguel Liu-Schiaffini
author: Miguel Liu-Schiaffini
description: "Miguel Liu-Schiaffini is a CS PhD student at Stanford."

url: https://mliuschi.github.io
baseurl: ""

# Emoji favicon, rendered inline as an SVG data URI — no icon files needed.
icon: "🌍"

# ── masthead ──
role: PhD Student
affiliation_html: >-
  <a href="https://www.cs.stanford.edu/">Computer Science Department</a>,
  Stanford University
# Displayed as plain text, never as a mailto: link, to avoid address harvesting.
email_display: "mliuschi [at] stanford [dot] edu"
cv_path: /assets/pdf/Miguel_Liu_Schiaffini_CV.pdf
avatar: /assets/img/miguel-avatar.jpg

# ── links shown as icons under your name ──
socials:
  scholar: https://scholar.google.com/citations?user=LebtA84AAAAJ
  github: https://github.com/mliuschi
  x: https://twitter.com/mliuschi
  linkedin: https://www.linkedin.com/in/miguel-liu-schiaffini/

# How many news items appear on the homepage (the rest live on /news/).
news_on_homepage: 5

# ── build ──
# The github-pages gem defaults unthemed sites to jekyll-theme-primer, which
# would emit its own assets/css/style.css into the build. This site supplies all
# its own layouts and CSS, so the theme is switched off entirely.
theme: null
plugins: []
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - bin
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - docker-compose.yml
  - README.md
  - LICENSE
  - .pdfcache
  - vendor
